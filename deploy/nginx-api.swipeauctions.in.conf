# nginx site block for api.swipeauctions.in — added alongside this VPS's existing sites (default,
# vyntra-lms), not replacing them. Install with:
#   cp nginx-api.swipeauctions.in.conf /etc/nginx/sites-available/api.swipeauctions.in
#   ln -s /etc/nginx/sites-available/api.swipeauctions.in /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# Then run `certbot --nginx -d api.swipeauctions.in` once DNS points here — certbot rewrites this file
# in place to add the HTTPS server block + redirect, the same way it already did for vyntra-lms.
server {
    listen 80;
    listen [::]:80;

    server_name api.swipeauctions.in;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade support (STOMP over SockJS at /ws) — the app negotiates SockJS fallbacks too,
        # but a direct upgrade path is cheaper when the client supports it.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
