# Runs on the Hostinger VPS, which also hosts an unrelated app (vyntra-lms) directly on port 8080 —
# `app` is published on 8081, and `db` is never published to the host at all (only reachable by `app`
# over this compose file's private network), so neither collides with anything else already running.
services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: swipeauctions
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backups:/backups

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - db
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      SUPABASE_DB_URL: jdbc:postgresql://db:5432/swipeauctions
      SUPABASE_DB_USER: ${DB_USER}
      SUPABASE_DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      ADMIN_JWT_EXPIRATION: ${ADMIN_JWT_EXPIRATION:-300000}
      APP_FRONTEND_URL: https://swipeauctions.in
      APP_CORS_ALLOWED_ORIGINS: https://swipeauctions.in
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      RAZORPAY_ACCOUNT_NUMBER: ${RAZORPAY_ACCOUNT_NUMBER}
      SWIPE_STOCK_SELLER_PASSWORD: ${SWIPE_STOCK_SELLER_PASSWORD}
    volumes:
      - uploads:/app/uploads

volumes:
  db-data:
  uploads:
