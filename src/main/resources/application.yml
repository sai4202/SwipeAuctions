spring:
  application:
    name: swipeauctions
  datasource:
    # Supabase Postgres — session pooler or direct connection (NOT the transaction pooler on 6543).
    # Supply these via environment variables; never commit real credentials.
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      # Flyway owns the schema; JPA only validates that entities match the migrated tables.
      ddl-auto: validate
    # Enabled for now so controllers can lazily map entities to response DTOs; revisit before scale.
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  servlet:
    multipart:
      # Raised from 10MB/25MB so short listing videos (not just images) fit through the same upload endpoint.
      max-file-size: 100MB
      max-request-size: 150MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  # Railway (and most PaaS hosts) assign the listen port at runtime via $PORT — binding to a fixed
  # 8080 instead would make the container unreachable there. Falls back to 8080 for local dev.
  port: ${PORT:8080}

logging:
  level:
    org.flywaydb: info

# JWT — secret sourced from env (same value as the original backend), never committed
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

admin:
  jwt:
    # Admin sessions time out after 5 minutes (user decision 2026-07-21, raised from an initial 2min
    # same-day) — much shorter than the regular user JWT above, since the admin dashboard is a
    # higher-privilege surface. Frontend shows a "session expired" modal on the resulting 401 rather
    # than leaving the dashboard silently broken (see api.ts's response interceptor).
    expiration: ${ADMIN_JWT_EXPIRATION:300000}

app:
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:3000}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  cors:
    # Comma-separated browser origins allowed to call this API (the Vite dev server locally; the
    # deployed frontend's origin in production — e.g. https://swipe-auctions.vercel.app).
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Authentication
auth:
  # Max concurrent signed-in devices per user (user decision 2026-07-18: capped back down to 2).
  max-active-sessions: ${AUTH_MAX_ACTIVE_SESSIONS:2}
  # Mobile/SMS OTP is a pure logging stub (LoggingSmsServiceImpl) until a real SMS provider is
  # wired up — required=false skips mobile OTP entirely (email verification alone activates the
  # account). Flip to true (or set AUTH_MOBILE_VERIFICATION_REQUIRED=true) once real SMS is live.
  mobile-verification-required: ${AUTH_MOBILE_VERIFICATION_REQUIRED:false}

# Dispute wallet-freeze: how long a seller's sale proceeds stay escrowed (held, not available)
# before auto-release, absent an open dispute on that auction.
dispute:
  proceeds-hold-hours: ${DISPUTE_PROCEEDS_HOLD_HOURS:48}

# Razorpay — real money. All blank by default: the app boots and the rest of the platform works
# fine without them; wallet top-up, registration fee, and subscription payment need key-id/secret;
# seller withdrawals additionally need account-number (RazorpayX), gated independently since a
# merchant can have standard Payments access without Payouts access.
razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  account-number: ${RAZORPAY_ACCOUNT_NUMBER:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
