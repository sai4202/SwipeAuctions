<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SwipeAuctions</title>
    <script>
      // Applied before first paint so a returning visitor never sees a flash of the wrong theme
      // while React boots up. Light is the default (user decision 2026-08-02, both admin and
      // user-facing) — only an explicit stored "dark" preference overrides that.
      try {
        var t = localStorage.getItem('swipeauctions_theme')
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light')
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light') }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
