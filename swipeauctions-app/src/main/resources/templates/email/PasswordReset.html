<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<div th:replace="email/base :: emailLayout(~{::section})">

    <section>

        <p>
            Hello
            <strong th:text="${firstName}">
                User
            </strong>,
        </p>

        <p>
            We received a request to reset your Swipe Auctions password.
        </p>

        <p>
            Click the button below to reset your password.
        </p>

        <div style="
                text-align:center;
                margin:30px 0;
        ">

            <a th:href="${resetLink}"
               style="
                    background:#FBBF24;
                    color:#0F172A;
                    text-decoration:none;
                    padding:15px 30px;
                    border-radius:8px;
                    font-weight:bold;
                    display:inline-block;
               ">
                Reset Password
            </a>

        </div>

        <p>
            This link will expire in 24 hours.
        </p>

        <p>
            If you did not request a password reset,
            please ignore this email.
        </p>

    </section>

</div>

</html>
