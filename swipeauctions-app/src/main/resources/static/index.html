<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>SwipeAuctions</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #334155 100%);
      color: #e2e8f0; padding: 24px;
    }
    .card {
      width: 100%; max-width: 560px; background: rgba(15,23,42,.6);
      border: 1px solid rgba(148,163,184,.25); border-radius: 18px;
      padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,.45); backdrop-filter: blur(6px);
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .logo {
      width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
      background: linear-gradient(135deg,#22d3ee,#3b82f6); color: #06121f; font-weight: 800; font-size: 22px;
    }
    h1 { font-size: 26px; margin: 0; letter-spacing: -.5px; }
    .tag { color: #94a3b8; margin: 4px 0 28px; font-size: 14px; }
    .pill {
      display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600;
      padding: 6px 12px; border-radius: 999px; background: rgba(34,197,94,.12);
      color: #4ade80; border: 1px solid rgba(74,222,128,.35);
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 10px #4ade80; }
    .grid { margin-top: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat { background: rgba(148,163,184,.08); border: 1px solid rgba(148,163,184,.18); border-radius: 12px; padding: 14px 16px; }
    .stat .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #94a3b8; }
    .stat .v { font-size: 18px; font-weight: 700; margin-top: 4px; word-break: break-word; }
    .muted { color:#64748b; font-size:12px; margin-top:24px; }
    a { color:#38bdf8; }
    .err { color:#f87171; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="logo">S</div>
      <h1>SwipeAuctions</h1>
    </div>
    <p class="tag">General-item auction platform · modular monolith skeleton</p>

    <span class="pill" id="pill"><span class="dot"></span> Backend running</span>

    <div class="grid">
      <div class="stat"><div class="k">App status</div><div class="v" id="app">…</div></div>
      <div class="stat"><div class="k">Database</div><div class="v" id="db">…</div></div>
      <div class="stat"><div class="k">Public tables</div><div class="v" id="tables">…</div></div>
      <div class="stat"><div class="k">Postgres</div><div class="v" id="pg">…</div></div>
    </div>

    <p class="muted">
      This is the Phase-0 scaffold. Data model migrated via Flyway to Supabase.
      Raw status: <a href="/api/status">/api/status</a>
    </p>
  </div>

  <script>
    fetch('/api/status').then(r => r.json()).then(d => {
      document.getElementById('app').textContent = d.status || 'UNKNOWN';
      const db = d.database || {};
      document.getElementById('db').textContent = db.connected ? 'Connected' : 'Not connected';
      document.getElementById('tables').textContent = (db.publicTables ?? '—');
      const ver = (db.server || '').match(/PostgreSQL \d+\.\d+/);
      document.getElementById('pg').textContent = ver ? ver[0] : (db.connected ? 'OK' : '—');
      if (!db.connected) {
        const pill = document.getElementById('pill');
        pill.style.background = 'rgba(248,113,113,.12)';
        pill.style.color = '#f87171';
        pill.style.borderColor = 'rgba(248,113,113,.35)';
        pill.innerHTML = '<span class="dot" style="background:#f87171;box-shadow:0 0 10px #f87171"></span> DB unreachable';
      }
    }).catch(e => {
      document.getElementById('app').textContent = 'error';
      document.getElementById('db').innerHTML = '<span class="err">fetch failed</span>';
    });
  </script>
</body>
</html>
